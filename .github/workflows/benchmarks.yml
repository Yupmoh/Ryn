name: Benchmarks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# TST-17: this workflow is PR-only, so always cancel a superseded run for the same PR ref.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # TST-17: pin the SDK to global.json and cache NuGet (key from Directory.Packages.props).
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Run benchmarks
        run: >
          dotnet run
          --project benchmarks/Ryn.Benchmarks/Ryn.Benchmarks.csproj
          -c Release
          --
          --filter "*"
          --exporters json
          --memory

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/
