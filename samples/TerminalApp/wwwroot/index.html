<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ryn Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1e1e2e; display: flex; flex-direction: column; height: 100vh; color: #cdd6f4; }
        #toolbar { background: #181825; padding: 8px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #313244; font-family: system-ui; font-size: 13px; }
        #toolbar button { background: #45475a; border: none; color: #cdd6f4; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        #toolbar button:hover { background: #585b70; }
        #status { color: #a6e3a1; }
        #metrics { margin-left: auto; color: #6c7086; font-size: 11px; font-family: monospace; }
        #terminal { flex: 1; background: #1e1e2e; color: #cdd6f4; font-family: 'SF Mono', 'Cascadia Code', monospace; font-size: 14px; padding: 8px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; outline: none; }
        #terminal:focus { box-shadow: inset 0 0 0 1px #89b4fa; }
    </style>
</head>
<body>
    <div id="toolbar">
        <span>Ryn Terminal</span>
        <span id="status">starting...</span>
        <button onclick="clearTerminal()">Clear</button>
        <button onclick="killSession()">Kill</button>
        <div id="metrics"></div>
    </div>
    <div id="terminal" tabindex="0"></div>

    <script>
        var terminal = document.getElementById('terminal');
        var statusEl = document.getElementById('status');
        var metricsEl = document.getElementById('metrics');
        var sessionId = null;
        var decoder = new TextDecoder();

        function append(text) {
            terminal.appendChild(document.createTextNode(text));
            terminal.scrollTop = terminal.scrollHeight;
        }

        function decodeBase64(value) {
            var binary = atob(value);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function encodeBase64(text) {
            var bytes = new TextEncoder().encode(text);
            var binary = '';
            for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }

        function clearTerminal() { terminal.textContent = ''; }

        async function killSession() {
            if (sessionId === null) return;
            await window.__ryn.invoke('shell.ptyKill', { sessionId: sessionId });
        }

        async function writeInput(text) {
            if (sessionId === null) return;
            await window.__ryn.invoke('shell.ptyWrite', { sessionId: sessionId, base64Data: encodeBase64(text) });
        }

        function terminalDimensions() {
            return {
                cols: Math.max(1, Math.floor(terminal.clientWidth / 8.4)),
                rows: Math.max(1, Math.floor(terminal.clientHeight / 19.5))
            };
        }

        async function resizeSession() {
            if (sessionId === null) return;
            var dims = terminalDimensions();
            await window.__ryn.invoke('shell.ptyResize', { sessionId: sessionId, cols: dims.cols, rows: dims.rows });
        }

        terminal.addEventListener('keydown', function(event) {
            if (event.metaKey || event.ctrlKey || event.altKey) return;
            var text = event.key === 'Enter' ? '\r' : event.key === 'Backspace' ? '\x7f' : event.key.length === 1 ? event.key : '';
            if (!text) return;
            event.preventDefault();
            writeInput(text);
        });

        window.addEventListener('resize', resizeSession);

        async function start() {
            if (!window.__ryn) {
                statusEl.textContent = 'bridge unavailable';
                append('Launch with: dotnet run --project samples/TerminalApp\n');
                return;
            }

            var dims = terminalDimensions();
            var shell = navigator.userAgent.includes('Windows') ? 'cmd.exe' : '/bin/bash';
            sessionId = await window.__ryn.invoke('shell.pty', {
                command: shell,
                argsJson: '[]',
                cols: dims.cols,
                rows: dims.rows
            });

            window.__ryn.on('shell.pty.stdout.' + sessionId, function(chunks) {
                for (var i = 0; i < chunks.length; i++) append(decoder.decode(decodeBase64(chunks[i]), { stream: true }));
            });
            window.__ryn.on('shell.pty.exit.' + sessionId, function(exitCode) {
                statusEl.textContent = 'exited ' + exitCode;
                sessionId = null;
            });

            statusEl.textContent = 'interactive';
            terminal.focus();
        }

        setInterval(async function() {
            if (!window.__ryn) return;
            try {
                var metrics = await window.__ryn.invoke('shell.ptyMetrics');
                metricsEl.textContent = metrics.length ? 'chunks:' + metrics[0].flushed + ' dropped:' + metrics[0].dropped : '';
            } catch (error) { metricsEl.textContent = 'metrics unavailable'; }
        }, 2000);

        start().catch(function(error) {
            statusEl.textContent = 'failed';
            append('Error: ' + error.message + '\n');
        });
    </script>
</body>
</html>
